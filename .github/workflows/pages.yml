name: Deploy site to GitHub Pages

# Builds the static edition (marketing site + in-browser demo) and publishes it.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-pages.mjs
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          PAGES_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Optional repository variables (Settings > Secrets and variables > Actions > Variables):
          # PAGES_CNAME for a custom domain, APP_ORIGIN / API_BASE once the server edition is deployed.
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
